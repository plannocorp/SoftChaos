name: End-to-end

on:
  push:
    branches: [homolog, deploy]
  pull_request:
    branches: [deploy]

jobs:
  postgres-schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/softchaos-schema" @electric-sql/pglite@0.5.8
      - run: node --test backend/scripts/schema.test.mjs
        env:
          NODE_PATH: ${{ runner.temp }}/softchaos-schema/node_modules

  backend-security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B test

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/softchaos-e2e" playwright@1.62.1
      - run: |
          "$RUNNER_TEMP/softchaos-e2e/node_modules/.bin/playwright" install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          NODE_PATH: ${{ runner.temp }}/softchaos-e2e/node_modules
      - run: npm run test:e2e
        env:
          E2E_SERVE_BUILD: 'true'
          NODE_PATH: ${{ runner.temp }}/softchaos-e2e/node_modules
