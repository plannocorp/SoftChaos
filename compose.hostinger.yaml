services:
  backend:
    container_name: softchaos-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.hostinger
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
    expose:
      - "8080"
    networks:
      - vps_default

networks:
  vps_default:
    external: true
