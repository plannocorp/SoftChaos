# ========================================
# CONFIGURAÇÕES DE PRODUÇÃO
# ========================================

# ========================================
# BANCO DE DADOS POSTGRESQL
# ========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Uploads de mídia são limitados para reduzir consumo de memória e disco temporário.
app.upload.max-file-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ========================================
# JPA/HIBERNATE
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ========================================
# FLYWAY (Habilitado em PROD)
# ========================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ========================================
# LOGGING (Menos verboso em PROD)
# ========================================
logging.level.root=WARN
logging.level.com.softchaos=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ========================================
# CORS (Restritivo em PROD)
# ========================================
app.cors.allowed-origins=${FRONTEND_URL:https://www.softchaos.blog},https://softchaos.pages.dev,https://www.softchaos.blog
app.security.expose-docs=false
app.security.expose-h2-console=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ========================================
# FRONTEND URL
# ========================================
app.frontend.url=${FRONTEND_URL:https://seu-dominio.com}

# ========================================
# SEGURANÇA
# ========================================
# Importado do .env ou do ambiente do servidor
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================
# SSL/HTTPS
# ========================================
server.ssl.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
# Configure SSL se necessário
# server.ssl.key-store=classpath:keystore.p12
